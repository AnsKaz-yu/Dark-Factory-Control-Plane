<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReservoirOS — стадия реализации</title>
<style>
:root{--bg:#0b1020;--panel:#141b2e;--panel2:#1c2540;--txt:#e6ebf5;--muted:#93a0bd;--line:#2a3554;--acc:#a855f7;}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a2340,#0b1020);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.45}
.app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(20,27,46,.7);flex-wrap:wrap}
header h1{font-size:19px;margin:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#4ade80}
.live .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;animation:pulse 1.6s infinite}
.live.off{color:#f87171}.live.off .dot{background:#f87171;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hstat{font-size:12px;color:var(--muted)}.hstat b{color:var(--txt)}
.overall{display:flex;align-items:center;gap:8px;margin-left:auto}
.bar{width:160px;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#a855f7,#22c55e)}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 10px}
.tnode{padding:7px 9px;border-radius:8px;cursor:pointer;margin:2px 0;border-left:3px solid transparent}
.tnode:hover{background:var(--panel2)}
.tnode.sel{background:var(--panel2);border-left-color:var(--acc)}
.tnode .row{display:flex;align-items:center;gap:7px}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tname{font-size:13px;flex:1;word-break:break-word;line-height:1.3}
.tpct{font-size:11px;color:var(--muted)}
.crapb{font-size:10px;padding:0 6px;border-radius:5px;font-weight:600}
.tkids{margin-left:14px;border-left:1px dashed var(--line);padding-left:6px}
main{overflow-y:auto;padding:20px 24px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}
.crumb a{color:#7dd3fc;cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
.dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{font-size:22px;margin:0}
.kind{font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:2px 9px;border-radius:6px;color:var(--muted)}
.status{font-size:12px;padding:2px 10px;border-radius:6px;font-weight:600}
.metrics{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:150px}
.mcard .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.mcard .val{font-size:24px;font-weight:700;margin-top:3px}
.mcard .sub{font-size:11px;color:var(--muted)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14px;color:#cdd6ea;margin:14px 0}
section h3{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
section h3 .tag{font-size:11px;color:var(--muted);font-weight:400}
.graph{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
svg text{font-family:'Segoe UI',sans-serif}
.gnode{cursor:pointer}
.gnode rect{transition:.15s}.gnode:hover rect{stroke-width:2.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.refresh-btn{background:var(--panel2);border:1px solid var(--line);color:#7dd3fc;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:.15s}
.refresh-btn:hover{border-color:#7dd3fc;background:#22304f}
.refresh-btn:active{transform:scale(.96)}
.refresh-btn.loading{opacity:.6;cursor:wait}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);color:#7dd3fc;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;margin-bottom:10px;transition:.15s;max-width:100%;word-break:break-word}
.back-btn:hover{border-color:#7dd3fc;background:#22304f;transform:translateX(-2px)}
.agent-link{cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.agent-link:hover{border-color:#7dd3fc;background:#22304f;transform:translateY(-1px)}
.comp-link{color:#7dd3fc;cursor:pointer;text-decoration:none;border-bottom:1px dashed #7dd3fc66;transition:.15s}
.comp-link:hover{color:#a5f3fc;border-bottom-color:#a5f3fc}
.comp-link-hint{font-size:11px;color:var(--muted);margin-left:4px}
.comp-link:hover .comp-link-hint{color:#7dd3fc}
.legend span{display:inline-flex;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.covbar{width:120px;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;display:inline-block;vertical-align:middle}
.covbar>i{display:block;height:100%;background:#22c55e}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;max-width:640px;width:92%;max-height:86vh;overflow-y:auto}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0}
.step{font-size:11px;padding:4px 10px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.step.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.step.done{background:#14532d;color:#4ade80;border-color:#14532d}
.kv{font-size:13px;margin:6px 0}.kv b{color:var(--muted);font-weight:500;display:inline-block;min-width:120px}
.agents{display:flex;gap:8px;flex-wrap:wrap}
.agent{font-size:11px;background:var(--panel2);border:1px solid var(--line);padding:3px 10px;border-radius:14px}
.agent b{color:#7dd3fc}
.empty{color:var(--muted);font-size:13px;padding:14px}
.diagram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.diagram-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:zoom-in;transition:.15s}
.diagram-card:hover{border-color:var(--acc)}
.diagram-card .cap{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.diagram-card .cap b{color:#7dd3fc;font-weight:600}
.diagram-card img{width:100%;border-radius:8px;background:#0d1424;display:block}
.diagram-full{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.diagram-full img{width:100%;border-radius:8px;background:#0d1424;cursor:zoom-in}
.imgmodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
.imgmodal-bg.show{display:flex}
.imgmodal-bg img{max-width:96vw;max-height:96vh;border-radius:8px;background:#0d1424}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ReservoirOS — стадия реализации</h1>
    <span class="live off" id="live"><span class="dot"></span><span id="liveTxt">connecting…</span></span>
    <span class="hstat" title="Время последней проверки/обновления дашборда (время компьютера). Обновляется при каждом обновлении, в т.ч. по кнопке «Обновить».">обновлено: <b id="upd">—</b></span>
    <span class="hstat" title="Время последнего изменения состояния (project-state.json) агентами">данные от: <b id="stateUpd">—</b></span>
    <span class="hstat">агенты: <b id="agentCount">0</b></span>
    <button id="refreshBtn" class="refresh-btn" title="Обновить состояние вручную">⟳ Обновить</button>
    <div class="overall"><span class="hstat">готовность</span><div class="bar"><i id="overallBar" style="width:0%"></i></div><b id="overallPct">0%</b></div>
  </header>
  <aside><h2>Архитектура (клик → детали)</h2><div id="tree"></div></aside>
  <main id="main"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="imgmodal-bg" id="imgModal"><img id="imgModalImg" alt="diagram"></div>
<script>
const STATUS={planned:"#64748b","in-progress":"#3b82f6",done:"#22c55e",blocked:"#ef4444"};
const TSTATUS={"awaiting-approval":"#f59e0b",ready:"#06b6d4","in-progress":"#3b82f6",blocked:"#ef4444",done:"#22c55e"};
const TLABEL={"awaiting-approval":"ждёт утверждения",ready:"готова к реализации","in-progress":"реализуется",blocked:"заблокирована",done:"готово"};
const LOOP=["feature","red","implement","green","gates","c4","chronology","commit","ci"];
const LOOPLBL={feature:"фича/тесты",red:"RED",implement:"реализация",green:"GREEN",gates:"гейты",c4:"C4",chronology:"хронология",commit:"коммит",ci:"CI"};
let S=null, sel=null, DIAG=null, lastFetch=null;
function fmtLocal(d){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
const DIAG_BASE="http://127.0.0.1:8092";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function node(id,n=S?.architecture){if(!n)return null;if(n.id===id)return n;for(const c of n.children||[]){const r=node(id,c);if(r)return r}return null}
function path(id,n=S?.architecture,acc=[]){if(!n)return null;if(n.id===id)return[...acc,n];for(const c of n.children||[]){const r=path(id,c,[...acc,n]);if(r)return r}return null}
function descIds(n){let a=[n.id];(n.children||[]).forEach(c=>a=a.concat(descIds(c)));return a}
function subtree(n){let a=[n];(n.children||[]).forEach(c=>a=a.concat(subtree(c)));return a}
// Эффективные тесты узла: собственные (report_tests), иначе — сумма тестов задач этого узла
// (report_task_tests). Собственный отчёт приоритетнее, чтобы не задваивать одни и те же данные.
function nodeTests(x){
  if(x.tests)return x.tests;
  const ts=Object.values(S.tasks||{}).filter(t=>t.component===x.id&&t.tests);
  if(!ts.length)return null;
  let p=0,f=0,t=0;ts.forEach(tt=>{p+=tt.tests.passed||0;f+=tt.tests.failed||0;t+=tt.tests.total||0});
  return {passed:p,failed:f,total:t};
}
// Готовность узла: по прогрессу задач поддерева (done=100); без задач — среднее детей;
// лист без задач наследует готовность ближайшего предка с задачами (иначе ручная/статус).
// Правдивый прогресс: done=100; in-progress=max(reported, пол стадии loop); ready/blocked=0.
const STAGE_FLOOR={feature:5,red:20,implement:45,green:65,gates:80,c4:88,chronology:92,commit:96,ci:100};
function taskProg(t){if(t.status==="done")return 100;if(t.status==="in-progress")return Math.max(t.progress||0,STAGE_FLOOR[t.loopStage]||0);return 0}
// Агенты DMTools (CliAgent) — отдельный источник (реестр .locks/dmtools-agents.json).
function dmtoolsAgents(){return S.dmtoolsAgents||[]}
function activeDmtools(){return dmtoolsAgents().filter(a=>a.status==="running")}
function dmtoolsFor(n){const ids=descIds(n);return dmtoolsAgents().filter(a=>{const t=S.tasks[a.task];return t&&ids.includes(t.component)})}
const DMSTATUS={running:"#3b82f6",done:"#22c55e",failed:"#ef4444"};
const DMLABEL={running:"в работе",done:"завершено",failed:"гейты не пройдены"};
function readinessOf(n){
  const ts=tasksFor(n);
  if(ts.length)return Math.round(ts.reduce((a,t)=>a+taskProg(t),0)/ts.length);
  const kids=n.children||[];
  if(kids.length)return Math.round(kids.map(readinessOf).reduce((a,b)=>a+b,0)/kids.length);
  // лист без задач: наследуем готовность предка только для внутренних подмодулей (kind=code);
  // самостоятельные компоненты/контейнеры без задач сохраняют ручную/статусную готовность.
  if(n.kind==="code"){const p=path(n.id)||[];for(let i=p.length-2;i>=0;i--){const at=tasksFor(p[i]);if(at.length)return Math.round(at.reduce((a,t)=>a+taskProg(t),0)/at.length);}}
  return n.readiness??(n.status==="done"?100:0);
}
// Свёртка метрик по поддереву: готовность (по задачам), CRAP (худший),
// покрытие (пропорционально объёму кода: Σ покрытых строк / Σ всех строк), тесты и задачи (сумма).
function rollup(n){
  const readiness=readinessOf(n);
  const sub=subtree(n);
  const craps=sub.map(x=>x.crap).filter(v=>v!=null);
  const crap=craps.length?Math.max(...craps):null;
  let p=0,f=0,t=0,hasT=false;sub.forEach(x=>{const tt=nodeTests(x);if(tt){p+=tt.passed||0;f+=tt.failed||0;t+=tt.total||0;hasT=true}});
  const tests=hasT?{passed:p,failed:f,total:t}:null;
  // Покрытие: взвешивание по объёму кода (строки), а не по числу тестов.
  const covs=sub.filter(x=>(x.coverage??(x.tests&&x.tests.coverage))!=null);
  let coverage=null,coverageLines=null,coverageApprox=false;
  if(covs.length){
    let tot=0,cov=0,wU=0,sU=0;
    covs.forEach(x=>{
      const c=x.coverage??x.tests.coverage;
      const total=x.linesTotal??x.loc??(x.tests&&(x.tests.linesTotal??x.tests.loc))??null;
      if(total!=null&&total>0){
        const covered=x.linesCovered??(x.tests&&x.tests.linesCovered)??(c/100*total);
        tot+=total;cov+=covered;
      }else{ // нет данных о строках — приближённый вес по числу тестов (помечается ≈)
        const w=(x.tests&&x.tests.total)||1;sU+=c*w;wU+=w;coverageApprox=true;
      }
    });
    const den=tot+wU;
    if(den>0){coverage=Math.round((cov+sU)/den*1000)/10;coverageLines=tot>0?{covered:Math.round(cov),total:tot}:null;}
  }
  const ts=tasksFor(n);
  const tasks={total:ts.length,inProgress:ts.filter(x=>x.status==="in-progress").length,done:ts.filter(x=>x.status==="done").length,blocked:ts.filter(x=>x.status==="blocked").length};
  return {readiness,crap,coverage,coverageLines,coverageApprox,tests,tasks};
}
function crapColor(v){if(v==null)return"#64748b";if(v<=15)return"#22c55e";if(v<=30)return"#f59e0b";return"#ef4444"}
function crapBadge(v){const c=crapColor(v);return `<span class="crapb" style="background:${c}22;color:${c};border:1px solid ${c}55">CRAP ${v==null?"—":v}</span>`}

async function loadDiag(){for(const base of [DIAG_BASE,""]){try{const d=await fetch(base+"/c4",{cache:"no-store"});const j=await d.json();if(j&&typeof j.available!=="undefined")return j}catch(e){}}return {available:false,message:"C4-документация не найдена. Если в проекте появится C4 (LikeC4), здесь появятся UML-диаграммы компонентов."}}
async function fetchState(){const r=await fetch("/state",{cache:"no-store"});S=await r.json();lastFetch=new Date();if(!sel)sel=S.architecture.id;if(!DIAG){DIAG=await loadDiag()}render()}
// Агент активен, только если его задача СЕЙЧАС в работе и он её владелец (не устаревшая запись реестра).
const AGENT_STALE_MS=15*60*1000;
function agentState(name,v){const tk=S.tasks[v.task];return {task:tk,active:!!tk&&tk.status==="in-progress"&&tk.owner===name,done:!!tk&&tk.status==="done"&&tk.owner===name,stale:!!v.lastSeen&&(Date.now()-Date.parse(v.lastSeen))>AGENT_STALE_MS};}
function activeAgents(){return Object.entries(S.agents||{}).filter(([a,v])=>agentState(a,v).active);}
function connectSSE(){try{const es=new EventSource("/events");es.onopen=()=>{$("live").classList.remove("off");$("liveTxt").textContent="live"};es.onerror=()=>{$("live").classList.add("off");$("liveTxt").textContent="reconnecting…"};es.onmessage=()=>fetchState()}catch(e){$("liveTxt").textContent="polling";setInterval(fetchState,4000)}}

function render(){
  if(!S)return;
  $("upd").textContent=lastFetch?fmtLocal(lastFetch):"—";
  const su=$("stateUpd");if(su){const du=S.gitUpdated||S.updated;su.textContent=du?fmtLocal(new Date(du)):"—";}
  const agents=activeAgents();
  const dmActive=activeDmtools();
  $("agentCount").textContent=agents.length+dmActive.length;
  $("agentCount").parentElement.title=`Активные агенты: ${agents.length} opencode + ${dmActive.length} DMTools (задача в работе)`;
  const ov=rollup(S.architecture).readiness;$("overallBar").style.width=ov+"%";$("overallPct").textContent=ov+"%";
  renderTree();renderDetail();
}
function renderTree(){
  function rec(n,depth){
    const c=STATUS[n.status]||"#64748b";
    const selCls=n.id===sel?"sel":"";
    const ru=rollup(n);
    let h=`<div class="tnode ${selCls}" data-id="${esc(n.id)}"><div class="row"><span class="sdot" style="background:${c}"></span><span class="tname">${esc(n.name)}</span><span class="tpct">${ru.readiness}%</span>${crapBadge(ru.crap)}</div></div>`;
    if((n.children||[]).length)h+=`<div class="tkids">${n.children.map(c=>rec(c,depth+1)).join("")}</div>`;
    return h;
  }
  $("tree").innerHTML=rec(S.architecture,0);
  $("tree").querySelectorAll(".tnode").forEach(el=>el.onclick=e=>{e.stopPropagation();sel=el.dataset.id;render()});
}
function renderDetail(){
  const n=node(sel);if(!n){$("main").innerHTML="<div class='empty'>нет данных</div>";return}
  const p=path(sel)||[n];
  const crumb=p.map((x,i)=>i<p.length-1?`<a data-id="${esc(x.id)}">${esc(x.name)}</a>`:`<span>${esc(x.name)}</span>`).join(" / ");
  const c=STATUS[n.status]||"#64748b";
  const ru=rollup(n);
  const t=ru.tests||{};
  const cov=ru.coverage;
  let h=`${p.length>1?`<button class="back-btn" id="backBtn" title="На уровень выше">← Назад · ${esc(p[p.length-2].name)}</button>`:""}<div class="crumb">${crumb}</div>
  <div class="dhead"><h2>${esc(n.name)}</h2><span class="kind">${esc(n.kind)}</span><span class="status" style="background:${c}22;color:${c}">${esc(n.status)}</span></div>
  <div class="metrics">
    <div class="mcard"><div class="lbl">Готовность</div><div class="val">${ru.readiness}%</div><div class="bar" style="width:130px;margin-top:6px"><i style="width:${ru.readiness}%"></i></div><div class="sub">done=100 · в работе — по стадии loop · по поддереву</div></div>
    <div class="mcard"><div class="lbl">CRAP (худший)</div><div class="val" style="color:${crapColor(ru.crap)}">${ru.crap==null?"—":ru.crap}</div><div class="sub">порог 30 · цель 15 · по поддереву</div></div>
    <div class="mcard"><div class="lbl">Покрытие тестами</div><div class="val">${cov==null?"—":(ru.coverageApprox?"≈":"")+cov+"%"}</div><div class="sub">${t.passed??0} passed / ${t.failed??0} failed${ru.coverageLines?` · ${ru.coverageLines.covered}/${ru.coverageLines.total} строк`:""} · по поддереву</div></div>
    <div class="mcard"><div class="lbl">Задачи</div><div class="val">${ru.tasks.total}</div><div class="sub">${ru.tasks.inProgress} в работе · ${ru.tasks.done} готово · ${ru.tasks.blocked} заблок.</div></div>
  </div>
  <div class="doc">${esc(n.doc||"Нет описания.")}</div>`;
  // children scheme
  if((n.children||[]).length){
    h+=`<section><h3>Внутренняя схема <span class="tag">UML Component Diagram · клик → углубиться</span></h3><div class="graph">${childrenSVG(n)}</div>${umlComponentLegend()}</section>`;
  }
  h+=diagramsSection(n);
  // task graph (focal + blocking context)
  const ts=tasksFor(n);
  const graphNodes=taskGraphData(n);
  h+=`<section><h3>Граф задач <span class="tag">UML Activity Diagram · ${ts.length} шт · клик → документация + стадия loop</span></h3>`;

  let s=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`+umlDefs();
  s+=`<circle cx="${initX}" cy="${cy}" r="9" fill="#e6ebf5"/>`;
  s+=`<circle cx="${fx}" cy="${cy}" r="11" fill="none" stroke="#e6ebf5" stroke-width="2"/><circle cx="${fx}" cy="${cy}" r="6" fill="#e6ebf5"/>`;
  nodes.forEach(t=>{
    const deps=(t.blockedBy||[]).filter(d=>byId[d]);const p=pos[t.id];
    if(!deps.length){
      s+=`<path d="M${initX+9},${cy} C${initX+45},${cy} ${p.x-45},${p.y+H/2} ${p.x-3},${p.y+H/2}" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#umlFlow)"/>`;
    }
    deps.forEach(d=>{
      const a=pos[d];const active=byId[d].status!=="done";
      const col=active?"#ef4444":"#94a3b8";const mk=active?"url(#umlFlowR)":"url(#umlFlow)";
      const x1=a.x+W,y1=a.y+H/2,x2=p.x-3,y2=p.y+H/2;const mx=(x1+x2)/2;
      s+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="${active?2:1.5}" marker-end="${mk}" ${active?"":'opacity="0.6"'}/>`;
    });
    if(t.status==="done"){
      s+=`<path d="M${p.x+W},${p.y+H/2} C${p.x+W+45},${p.y+H/2} ${fx-45},${cy} ${fx-12},${cy}" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#umlFlow)"/>`;
    }
  });
  nodes.forEach(t=>{const p=pos[t.id];const c=TSTATUS[t.status]||"#64748b";const ext=!t.focal;const tl=titleLines[t.id];
    s+=`<g class="gnode" data-task="${esc(t.id)}" style="cursor:pointer">`;
    s+=`<rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="16" fill="${ext?"#0f1526":"#141b2e"}" stroke="${c}" stroke-width="1.5" ${ext?'stroke-dasharray="5,3"':""}/>`;
    s+=`<text x="${p.x+14}" y="${p.y+17}" fill="${c}" font-size="9" font-style="italic">«${esc(t.status)}»${ext?" ↗":""}</text>`;
    if(t.tests){const tc=(t.tests.failed??0)>0?"#f87171":"#4ade80";s+=`<text x="${p.x+W-12}" y="${p.y+17}" fill="${tc}" font-size="9" text-anchor="end" font-weight="600">${(t.tests.failed??0)>0?"✗":"✓"}${t.tests.passed??0}/${t.tests.total??0}</text>`;}
    s+=`<text x="${p.x+14}" y="${p.y+34}" fill="#e6ebf5" font-size="11" font-weight="700">${esc(t.id)}</text>`;
    s+=svgLines(p.x+14,p.y+50,tl,14,`fill="#e6ebf5" font-size="11"`);
    s+=`<text x="${p.x+14}" y="${p.y+50+tl.length*14+2}" fill="#93a0bd" font-size="9">${LOOPLBL[t.loopStage]||t.loopStage}${t.owner?" · "+esc(t.owner):""}</text>`;
    s+=`</g>`;
  });
  return s+"</svg>";
}
function openTask(id){
  const t=S.tasks[id];if(!t)return;
  const cn=node(t.component);const cname=cn?cn.name:t.component;
  const li=LOOP.indexOf(t.loopStage);
  const steps=LOOP.map((s,i)=>`<span class="step ${i<li?"done":i===li?"active":""}">${LOOPLBL[s]}</span>`).join("");
  const deps=(t.blockedBy||[]).map(d=>{const dt=S.tasks[d];return `<span class="agent" style="border-color:${dt&&dt.status==="done"?"#22c55e":"#ef4444"}">${esc(d)} ${dt?"("+TLABEL[dt.status]+")":""}</span>`}).join(" ")||"—";
  $("modal").innerHTML=`<span class="close" id="mclose">✕</span>
  <h3>${esc(t.id)} — ${esc(t.title)}</h3>
  <div class="kv"><b>Статус</b> <span style="color:${TSTATUS[t.status]}">${TLABEL[t.status]||t.status}</span></div>
  <div class="kv"><b>Компонент</b> <a class="comp-link" data-comp="${esc(t.component)}" title="Перейти на страницу компонента ${esc(t.component)}">${esc(cname)} <span class="comp-link-hint">→ страница компонента</span></a></div>
  <div class="kv"><b>Требование</b> ${esc(t.requirement||"—")}</div>
  <div class="kv"><b>Владелец</b> ${esc(t.owner||"—")}</div>
  <div class="kv"><b>Прогресс</b> ${t.progress??0}%</div>
  <div class="kv"><b>Тесты задачи</b> ${t.tests?`${t.tests.passed??0} passed · <span style="color:${(t.tests.failed??0)>0?'#f87171':'#4ade80'}">${t.tests.failed??0} failed</span> · ${t.tests.total??0} total${t.tests.coverage!=null?` · coverage ${t.tests.coverage}%`:""} ${(t.tests.failed??0)>0?'<span style="color:#f87171">✗ есть падения</span>':'<span style="color:#4ade80">✓</span>'}`:'<span style="color:var(--muted)">нет данных (report_task_tests)</span>'}</div>
  <div class="kv"><b>Зависит от</b> ${deps}</div>
  <div style="margin-top:12px;font-size:12px;color:var(--muted)">Стадия loop разработки:</div>
  <div class="stepper">${steps}</div>
  <div class="doc">${esc(t.doc||"Нет описания.")}</div>`;
  $("modalBg").classList.add("show");
  $("mclose").onclick=()=>$("modalBg").classList.remove("show");
  const cl=$("modal").querySelector(".comp-link");
  if(cl)cl.onclick=()=>{$("modalBg").classList.remove("show");sel=cl.dataset.comp;render();window.scrollTo(0,0)};
}
$("modalBg").onclick=e=>{if(e.target===$("modalBg"))$("modalBg").classList.remove("show")};
$("imgModal").onclick=()=>$("imgModal").classList.remove("show");
$("refreshBtn").onclick=async()=>{const b=$("refreshBtn");b.classList.add("loading");b.textContent="⟳ Обновление…";try{await fetchState()}finally{b.classList.remove("loading");b.textContent="⟳ Обновить";}};
fetchState().then(connectSSE);
</script>
